<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Management System</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .logo p {
            font-size: 14px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            width: 50%;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .tab.active {
            color: #2563eb;
            border-bottom: 3px solid #2563eb;
        }

        h2 {
            margin-bottom: 20px;
            color: #222;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            display: block;
            background: #dbeafe;
            color: #1e40af;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 13px;
        }

        #registerForm {
            display: none;
        }

        .password-note {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>School Management System</h1>
        <p>Manage your school from one platform</p>
    </div>

    <div class="card">

        <!-- TABS -->
        <div class="tabs">

            <button
                type="button"
                id="loginTab"
                class="tab active"
                onclick="showLogin()">
                Login
            </button>

            <button
                type="button"
                id="registerTab"
                class="tab"
                onclick="showRegister()">
                Register
            </button>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <h2>Welcome Back</h2>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="btn"
                id="loginButton">

                Login

            </button>

            <div id="loginMessage" class="message"></div>

        </form>


        <!-- REGISTER FORM -->

        <form id="registerForm">

            <h2>Create Account</h2>

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required>

                <div class="password-note">
                    Password must contain at least 6 characters.
                </div>

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>

            </div>


            <button
                type="submit"
                class="btn"
                id="registerButton">

                Create Account

            </button>

            <div id="registerMessage" class="message"></div>

        </form>

    </div>

    <div class="footer">
        School Management System
    </div>

</div>


<script>

    // ==================================================
    // SUPABASE CONFIGURATION
    // ==================================================

    // REPLACE THESE TWO VALUES WITH YOUR REAL VALUES

    const SUPABASE_URL = "Tap on a clip to paste it in the text box.";

    const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";


    // Create Supabase connection

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ==================================================
    // SHOW LOGIN
    // ==================================================

    function showLogin() {

        document.getElementById("loginForm").style.display = "block";

        document.getElementById("registerForm").style.display = "none";

        document.getElementById("loginTab").classList.add("active");

        document.getElementById("registerTab").classList.remove("active");

    }


    // ==================================================
    // SHOW REGISTER
    // ==================================================

    function showRegister() {

        document.getElementById("loginForm").style.display = "none";

        document.getElementById("registerForm").style.display = "block";

        document.getElementById("loginTab").classList.remove("active");

        document.getElementById("registerTab").classList.add("active");

    }


    // ==================================================
    // LOGIN
    // ==================================================

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                document.getElementById("loginEmail").value.trim();

            const password =
                document.getElementById("loginPassword").value;


            const button =
                document.getElementById("loginButton");

            const message =
                document.getElementById("loginMessage");


            button.disabled = true;

            button.textContent = "Logging in...";

            message.className = "message";

            message.style.display = "none";


            try {

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                if (error) {

                    throw error;

                }


                message.textContent =
                    "Login successful. Opening dashboard...";

                message.className =
                    "message success";


                // Give Supabase a moment to save the session

                setTimeout(function() {

                    window.location.href = "dashboard.html";

                }, 1000);


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Login failed: " + error.message;

                message.className =
                    "message error";


                button.disabled = false;

                button.textContent = "Login";

            }

        });


    // ==================================================
    // REGISTER
    // ==================================================

    document
        .getElementById("registerForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const name =
                document.getElementById("registerName").value.trim();

            const email =
                document.getElementById("registerEmail").value.trim();

            const password =
                document.getElementById("registerPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            const button =
                document.getElementById("registerButton");

            const message =
                document.getElementById("registerMessage");


            // Check passwords

            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                message.className =
                    "message error";

                return;

            }


            if (password.length < 6) {

                message.textContent =
                    "Password must be at least 6 characters.";

                message.className =
                    "message error";

                return;

            }


            button.disabled = true;

            button.textContent = "Creating account...";


            try {

                const { data, error } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {

                                full_name: name

                            }

                        }

                    });


                if (error) {

                    throw error;

                }


                message.textContent =
                    "Account created successfully. Check your email if email confirmation is enabled.";

                message.className =
                    "message success";


                document
                    .getElementById("registerForm")
                    .reset();


                button.disabled = false;

                button.textContent = "Create Account";


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Registration failed: " + error.message;

                message.className =
                    "message error";


                button.disabled = false;

                button.textContent = "Create Account";

            }

        });

</script>

</body>
                    </html>
